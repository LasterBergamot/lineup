[project]
name = "lineup"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "python-docx>=1.2.0",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.2",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "sentry-sdk[fastapi]>=2.71.0",
    "pyjwt[crypto]>=2.15.1",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.15",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "pdfplumber>=0.11.0",
    "pytest-asyncio>=0.23",
]

[tool.ruff.lint]
# S = flake8-bandit (security). D1 = pydocstyle's "missing docstring" checks only: every
# public module, class, function and method must explain itself. The style rules (D2xx/D4xx)
# are deliberately not enabled; what matters is content, not formatting.
extend-select = ["S", "D1"]

[tool.ruff.lint.per-file-ignores]
# assert is the standard pytest idiom, not a production risk; S310's "unexpected scheme"
# check is a false positive here — BASE_URL is a fixed local constant, never user input.
"tests/**/*.py" = ["S101", "S310", "D1"]
# Migration revisions are documented by their module docstring; upgrade()/downgrade() are the
# fixed Alembic entry points.
"alembic/versions/*.py" = ["D1"]
# subprocess.Popen([...]) with a literal executable and no shell=True; the "partial
# executable path" (S607) and "subprocess call" (S603) warnings don't apply here — see
# the comment above the call in this file.
"lineup/document/pdf_converter.py" = ["S603", "S607"]

[tool.pytest.ini_options]
# e2e tests need the running containerized API (real LibreOffice); exclude them by default
# so `task test` stays hermetic. `task test-e2e` re-selects them with `-m e2e`.
addopts = "-m 'not e2e'"
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end test requiring the running containerized API (deselected by default)",
]

[tool.coverage.run]
source = ["lineup"]
# SQLAlchemy's async ORM bridges sync calls onto greenlets (greenlet_spawn);
# without this, coverage silently drops line hits after those switches.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 100
