services:
  # ---------------------------------------------------------------------------
  # Flask API Application
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      target: development
    container_name: lineup-api
    ports:
      - "5000:5000"
    environment:
      # Flask configuration
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - SECRET_KEY=docker-dev-secret-key-do-not-use-in-production
      # CORS - allow all origins in development
      - CORS_ORIGINS=*
      # Database connection (for future use in Phase 3)
      - DATABASE_URL=postgresql://lineup:lineup_dev@db:5432/lineup_db
      # PostgreSQL specific settings (for future use)
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=lineup_db
      - POSTGRES_USER=lineup
      - POSTGRES_PASSWORD=lineup_dev
    volumes:
      # Mount source code for hot-reload during development
      - .:/app
      # Exclude Python cache directories (performance optimization)
      - /app/__pycache__
      - /app/.pytest_cache
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lineup-network
    restart: unless-stopped
    # Override command to enable Flask debug mode with auto-reload
    command: python -c "from app import create_app; app = create_app('development'); app.run(host='0.0.0.0', port=5000, debug=True, use_reloader=True)"

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: lineup-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=lineup_db
      - POSTGRES_USER=lineup
      - POSTGRES_PASSWORD=lineup_dev
      # Improve performance for development (not for production!)
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      # Persist database data across container restarts
      - postgres_data:/var/lib/postgresql/data
      # Optional: Mount initialization scripts
      # - ./scripts/init-db:/docker-entrypoint-initdb.d
    networks:
      - lineup-network
    restart: unless-stopped
    # Health check to ensure database is ready before API starts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lineup -d lineup_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # pgAdmin - Database Administration Tool
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lineup-pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@lineup.local
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - lineup-network
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    name: lineup-postgres-data
  pgadmin_data:
    name: lineup-pgadmin-data

networks:
  lineup-network:
    name: lineup-network
    driver: bridge
