[project]
name = "lineup"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-docx>=1.2.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "sentry-sdk[fastapi]>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.15",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "pdfplumber>=0.11.0",
    "pytest-asyncio>=0.23",
]

[tool.ruff.lint]
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
# assert is the standard pytest idiom, not a production risk; S310's "unexpected scheme"
# check is a false positive here — BASE_URL is a fixed local constant, never user input.
"tests/**/*.py" = ["S101", "S310"]
# subprocess.run([...]) with a literal executable and no shell=True; the "partial
# executable path" (S607) and "subprocess call" (S603) warnings don't apply here — see
# the comment above the call in this file.
"lineup/document/pdf_converter.py" = ["S603", "S607"]

[tool.pytest.ini_options]
# e2e tests need the running containerized API (real LibreOffice); exclude them by default
# so `task test` stays hermetic. `task test-e2e` re-selects them with `-m e2e`.
addopts = "-m 'not e2e'"
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end test requiring the running containerized API (deselected by default)",
]

[tool.coverage.run]
source = ["lineup"]
# SQLAlchemy's async ORM bridges sync calls onto greenlets (greenlet_spawn);
# without this, coverage silently drops line hits after those switches.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 100
