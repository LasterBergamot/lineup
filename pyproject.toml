[project]
name = "lineup"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-docx>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "ruff>=0.15.15",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "pdfplumber>=0.11.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
# e2e tests need the running containerized API (real LibreOffice); exclude them by default
# so `task test` stays hermetic. `task test-e2e` re-selects them with `-m e2e`.
addopts = "-m 'not e2e'"
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end test requiring the running containerized API (deselected by default)",
]

[tool.coverage.run]
source = ["lineup"]
# SQLAlchemy's async ORM bridges sync calls onto greenlets (greenlet_spawn);
# without this, coverage silently drops line hits after those switches.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 100
