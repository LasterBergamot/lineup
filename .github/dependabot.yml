version: 2

# Version-update PRs target `develop` (the integration branch); `main`
# only receives release merges from `develop`. Security-update PRs always
# target the default branch, which is also `develop`.

updates:
  # Python dependencies managed by uv (pyproject.toml + uv.lock in backend/).
  - package-ecosystem: "uv"
    directory: "/backend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  # Keep the two GitHub Actions workflows' pinned action versions current too.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"

  # Frontend dependencies (package.json + pnpm-lock.yaml in frontend/). Minor and patch
  # updates of related packages are grouped so a routine bump is one PR, not ten.
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Base image (python:3.14-slim, pinned by digest) and the uv image in
  # backend/Dockerfile.
  - package-ecosystem: "docker"
    directory: "/backend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    ignore:
      # Python 3.15 cannot build the image yet: lxml, pydantic-core, httptools, markupsafe,
      # pyyaml and uvloop have no 3.15 wheels (PR #138 failed on it). Remove this entry once
      # `uv sync --frozen --no-dev --no-build --python 3.15` works in backend/.
      - dependency-name: "python"
        versions: [">= 3.15"]
