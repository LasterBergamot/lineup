name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  checks:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: task lint

      - name: Format check
        run: uv run ruff format --check .
        working-directory: backend

      - name: Test with coverage
        run: task test

      - name: References page up to date
        run: task docs:check

      - name: Migrations match the models (SQLite)
        run: task migrate-check

  migrations-postgres:
    name: Migrations (Postgres)
    runs-on: ubuntu-latest
    # Throwaway database that lives for this job only, so the password is
    # not a secret. It proves what SQLite cannot: RLS, roles, grants and the
    # event trigger from the rls_and_least_privilege_role migration.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATE_DATABASE_URL: >-
        postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      POSTGRES_TEST_URL: >-
        postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Migrate a fresh database and assert RLS and privileges
        run: uv run pytest tests/test_postgres_migrations.py -v
        working-directory: backend

      - name: Models match the migrations (Postgres compares types too)
        run: uv run alembic check
        working-directory: backend

      - name: Migrations are reversible
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
        working-directory: backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    # No path filter on purpose: a filtered-out job would never report, and a job that is
    # (or later becomes) a required check must report on every PR. It costs about a minute.
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install frontend dependencies (frozen lockfile)
        run: task fe:install

      - name: Install backend dependencies (to dump the OpenAPI spec)
        run: uv sync --frozen
        working-directory: backend

      - name: Lint and format check
        run: task fe:lint

      - name: Type check
        run: task fe:typecheck

      - name: Unit tests
        run: task fe:test

      - name: Build
        run: task fe:build

      - name: API client matches the backend's OpenAPI spec
        run: task fe:api:check

      - name: Audit production dependencies (report only)
        run: pnpm audit --prod
        working-directory: frontend
        continue-on-error: true

  e2e:
    name: E2E (real PDF conversion)
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image, run container, verify PDF fidelity
        run: task test-e2e

      - name: Scan image for vulnerabilities (Trivy, human-readable)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "lineup:latest"
          format: table
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "0"

      - name: Scan image for vulnerabilities (Trivy, SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "lineup:latest"
          format: sarif
          output: trivy-results.sarif
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
