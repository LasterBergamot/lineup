name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Lint
        run: task lint

      - name: Format check
        run: uv run ruff format --check .

      - name: Test with coverage
        run: task test

  e2e:
    name: E2E (real PDF conversion)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Build image, run container, verify PDF fidelity
        run: task test-e2e
