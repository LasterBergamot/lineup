name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Read-only token for every job; a job that needs more says so itself (e2e: security-events).
permissions:
  contents: read

# A new push to a PR makes the older run pointless, so cancel it. Pushes to main/develop are
# never cancelled: every merge keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    name: Workflow files (actionlint, yamllint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

      # actionlint checks the expressions, the action inputs and (through shellcheck) the
      # `run:` scripts. The image is pinned by digest, the same as the base images.
      - name: actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

      - name: yamllint
        run: uvx yamllint==1.38.0 --strict -c .yamllint .github

  checks:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked
        working-directory: backend

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52  # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: task lint

      - name: Format check
        run: uv run ruff format --check .
        working-directory: backend

      - name: Test with coverage
        run: task test

      - name: References page up to date
        run: task docs:check

      - name: Migrations match the models (SQLite)
        run: task migrate-check

  migrations-postgres:
    name: Migrations (Postgres)
    runs-on: ubuntu-latest
    # Throwaway database that lives for this job only, so the password is
    # not a secret. It proves what SQLite cannot: RLS, roles, grants and the
    # event trigger from the rls_and_least_privilege_role migration.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATE_DATABASE_URL: >-
        postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      POSTGRES_TEST_URL: >-
        postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked
        working-directory: backend

      - name: Migrate a fresh database and assert RLS and privileges
        run: uv run pytest tests/test_postgres_migrations.py -v
        working-directory: backend

      - name: Models match the migrations (Postgres compares types too)
        run: uv run alembic check
        working-directory: backend

      - name: Migrations are reversible
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
        working-directory: backend

  tests-postgres:
    name: Backend tests (Postgres)
    runs-on: ubuntu-latest
    # The whole backend suite on a real Postgres (#38). SQLite tolerates things Postgres rejects
    # (aware vs naive datetimes, NOT NULL without a default, foreign-key and cascade details), and
    # those were found only by hand against Supabase. The coverage gate stays on the SQLite run
    # in "Lint & test"; this job only has to pass. The database is throwaway and lives for this
    # job only, so the password is not a secret.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: >-
        postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked
        working-directory: backend

      - name: Run the backend suite against Postgres
        run: uv run pytest -q
        working-directory: backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    # No path filter on purpose: a filtered-out job would never report, and a job that is
    # (or later becomes) a required check must report on every PR. It costs about a minute.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          enable-cache: true

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52  # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install frontend dependencies (frozen lockfile)
        run: task fe:install

      - name: Install backend dependencies (to dump the OpenAPI spec)
        run: uv sync --locked
        working-directory: backend

      - name: Lint and format check
        run: task fe:lint

      - name: Type check
        run: task fe:typecheck

      - name: Unit tests with coverage
        run: task fe:coverage

      - name: Build
        run: task fe:build

      - name: API client matches the backend's OpenAPI spec
        run: task fe:api:check

      - name: Audit production dependencies (report only)
        run: pnpm audit --prod
        working-directory: frontend
        continue-on-error: true

  frontend-e2e:
    name: Frontend browser tests (report only)
    runs-on: ubuntu-latest
    # Report only at first (#159): it must not block a PR until it has proven stable. It is a
    # separate job so a flaky browser never hides the result of the required `Frontend` job.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52  # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install frontend dependencies (frozen lockfile)
        run: task fe:install

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend

      - name: Browser tests at phone and desktop size
        run: task fe:e2e

      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: E2E (real PDF conversion)
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked
        working-directory: backend

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52  # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # No Docker layer cache on purpose: it was tried with buildx + the `gha` cache (#61) and the
      # second run's job time was the same (1m52s): the image builds in about 40 s, and the
      # Buildx set-up and cache export ate the saving.
      - name: Build image, run container, verify PDF fidelity
        run: task test-e2e

      # One scan, one result file: the table in the job summary is rendered from the same SARIF
      # that is uploaded, so the two can't disagree and the vulnerability database is
      # downloaded once.
      - name: Scan image for vulnerabilities (Trivy, SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: "lineup:latest"
          format: sarif
          output: trivy-results.sarif
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "0"

      - name: Show the Trivy findings
        if: ${{ hashFiles('trivy-results.sarif') != '' }}
        run: |
          findings=$(jq -r '.runs[].results[]? | "\(.ruleId)  \(.level)  \(.message.text | gsub("\n"; " | "))"' trivy-results.sarif)
          {
            echo "### Trivy (CRITICAL, HIGH, fixable)"
            echo '```'
            echo "${findings:-No findings.}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # `always()` would also run when the scan never produced a file; the upload would then
      # fail and hide the real error.
      - name: Upload Trivy results to GitHub code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' }}
        with:
          sarif_file: trivy-results.sarif
