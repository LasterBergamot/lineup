name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x

      - name: Lint
        run: task lint

      - name: Format check
        run: uv run ruff format --check .

      - name: Test with coverage
        run: task test

  e2e:
    name: E2E (real PDF conversion)
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x

      - name: Build image, run container, verify PDF fidelity
        run: task test-e2e

      - name: Scan image for vulnerabilities (Trivy, human-readable)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "lineup:latest"
          format: table
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "0"

      - name: Scan image for vulnerabilities (Trivy, SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "lineup:latest"
          format: sarif
          output: trivy-results.sarif
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
