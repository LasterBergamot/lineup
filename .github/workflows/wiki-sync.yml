name: Wiki Sync

on:
  push:
    branches: [develop]
    paths:
      - "documentation/**"

permissions:
  contents: write

jobs:
  sync:
    name: Mirror documentation/ into the wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v7

      - name: Checkout wiki
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror documentation/ into the wiki checkout
        run: |
          declare -A PAGE_MAP=(
            ["Home.md"]="Home.md"
            ["Newcomer-Guide.md"]="Newcomer-Guide.md"
            ["References.md"]="References.md"
            ["Current-State-Backend.md"]="Current-State:-Backend.md"
            ["Current-State-Everything-Else.md"]="Current-State:-Everything-Else.md"
            ["Current-State-Frontend.md"]="Current-State:-Frontend.md"
            ["Roadmap-Backend.md"]="Roadmap:-Backend.md"
            ["Roadmap-Everything-Else.md"]="Roadmap:-Everything-Else.md"
            ["Roadmap-Frontend.md"]="Roadmap:-Frontend.md"
          )
          # A page missing from PAGE_MAP would silently never be
          # published, so fail instead.
          for file in documentation/*.md; do
            name="$(basename "$file")"
            if [[ -z "${PAGE_MAP[$name]:-}" ]]; then
              echo "::error::documentation/${name} is missing from PAGE_MAP"
              exit 1
            fi
          done
          for src in "${!PAGE_MAP[@]}"; do
            cp "documentation/${src}" "wiki/${PAGE_MAP[$src]}"
          done

      - name: Commit and push if changed
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to sync."
          else
            git commit -m "Sync wiki from documentation/ (${GITHUB_SHA})"
            git push
          fi
