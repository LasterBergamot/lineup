name: Wiki Sync

on:
  push:
    branches: [develop]
    # The workflow and its script are inputs too: changing how pages are mirrored must re-mirror.
    paths:
      - "documentation/**"
      - "scripts/sync_wiki.py"
      - ".github/workflows/wiki-sync.yml"
  # For a manual re-sync, for example after someone edited the wiki in the browser.
  workflow_dispatch:

permissions:
  contents: write

# Two quick pushes would race on the wiki's `git push`; queue them instead (the second run then
# copies the newest documentation/ anyway). Never cancel a run that is half-way through a push.
concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror documentation/ into the wiki
    # A manual run from another branch would publish that branch's unreviewed pages.
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Checkout wiki
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      # The wiki page for each file is named after its `# Title` (scripts/sync_wiki.py), so a
      # new page needs no edit here. The script fails on a page without a title or two pages
      # with the same one, and deletes wiki pages whose source file is gone.
      - name: Mirror documentation/ into the wiki checkout
        run: python3 scripts/sync_wiki.py documentation wiki

      - name: Commit and push if changed
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to sync."
          else
            git commit -m "Sync wiki from documentation/ (${GITHUB_SHA})"
            git push
          fi
