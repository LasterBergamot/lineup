<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Calibri and Calibri Light are proprietary Microsoft fonts and are not present in the
  container. Carlito is a libre, metric-compatible substitute (identical advance widths),
  so mapping Calibri -> Carlito makes headless LibreOffice reproduce the .docx template's
  layout instead of falling back to a font with different metrics (which shifts the
  tab-stop-based labels and the fixed player table).

  LibreOffice also has its own built-in Calibri -> Carlito substitution; these rules make
  the mapping explicit at the fontconfig level as well.
-->
<fontconfig>
  <match target="pattern">
    <test name="family" compare="eq">
      <string>Calibri</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Carlito</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq">
      <string>Calibri Light</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Carlito</string>
    </edit>
  </match>
</fontconfig>
