version: "3"

tasks:
  run:
    dir: backend
    desc: Run the application
    cmd: uv run python main.py

  install:
    dir: backend
    desc: Install dependencies
    cmd: uv sync

  lint:
    dir: backend
    desc: Lint the codebase
    cmd: uv run ruff check .

  format:
    dir: backend
    desc: Format the codebase
    cmd: uv run ruff format .

  serve:
    dir: backend
    desc: Start the API server (loads backend/.env if present, so it follows task db:sqlite / db:postgres)
    cmd: |
      set -a
      [ -f .env ] && . ./.env
      set +a
      uv run uvicorn app:app --reload

  db:status:
    dir: backend
    desc: Show which database the app will use (based on backend/.env)
    silent: true
    cmd: |
      if [ -f .env ] && grep -qE '^DATABASE_URL="postgresql' .env; then
        host=$(grep -E '^DATABASE_URL="postgresql' .env | sed -E 's|.*@([^/?]*).*|\1|')
        echo "postgres (Supabase pooler: $host)"
      else
        echo "sqlite (local backend/lineup.db)"
      fi

  db:sqlite:
    dir: backend
    desc: Switch backend/.env to local SQLite (comments out the Postgres URL, removes ENV=production)
    silent: true
    cmd: |
      [ -f .env ] || { echo "No .env: already on SQLite (the default)."; exit 0; }
      sed -E -i 's|^(DATABASE_URL="postgresql\+asyncpg://[^"<>]*:6543/[^"]*")|# \1|; /^ENV=production[[:space:]]*$/d' .env
      echo "Switched to SQLite. Restart task serve / run task up to apply."

  db:postgres:
    dir: backend
    desc: Switch backend/.env to the Supabase Postgres pooler (uncomments the saved URL, sets ENV=production)
    silent: true
    cmd: |
      [ -f .env ] && grep -qE '^#? ?DATABASE_URL="postgresql\+asyncpg://[^"<>]*:6543/' .env || {
        echo "No filled-in pooler DATABASE_URL (port 6543) found in backend/.env. Copy backend/.env.example to backend/.env and add your Supabase URL first." >&2
        exit 1
      }
      sed -E -i 's|^# (DATABASE_URL="postgresql\+asyncpg://[^"<>]*:6543/[^"]*")|\1|' .env
      if ! grep -qE '^ENV=production' .env; then
        [ -z "$(tail -c1 .env)" ] || echo >> .env
        echo 'ENV=production' >> .env
      fi
      echo "Switched to Postgres. Restart task serve / run task up to apply."

  test:
    dir: backend
    desc: Run tests with coverage (100%; e2e tests excluded via pyproject addopts)
    cmd: uv run pytest --cov=lineup --cov-report=term-missing

  test-e2e:
    desc: Build+run the container and validate real PDF conversion fidelity
    cmds:
      - docker build -t lineup backend
      - docker compose up -d --wait --wait-timeout 120
      - defer: docker compose down
      - cd backend && uv run pytest -m e2e tests/test_pdf_conversion_e2e.py -v

  build:
    desc: Build the container image
    cmd: docker build -t lineup backend

  rebuild:
    desc: Force a fresh container image build (no cache)
    cmd: docker build --no-cache -t lineup backend

  up:
    desc: Start the API in a container (detached)
    cmd: docker compose up -d

  down:
    desc: Stop the container
    cmd: docker compose down

  migrate:
    dir: backend
    desc: Apply Alembic migrations (upgrade head)
    cmd: uv run alembic upgrade head

  migrate-check:
    dir: backend
    desc: Apply every migration to a throwaway SQLite file, then fail if the models drifted from them
    cmd: |
      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT
      export DATABASE_URL="sqlite+aiosqlite:///$tmp/check.db"
      uv run alembic upgrade head
      uv run alembic check

  migrate:supabase:
    dir: backend
    desc: Apply migrations to Supabase using MIGRATE_DATABASE_URL from backend/.env.migrate (direct/session connection)
    silent: true
    cmd: |
      url=$(sed -nE 's/^MIGRATE_DATABASE_URL="?([^"[:space:]]+)"?[[:space:]]*$/\1/p' .env.migrate 2>/dev/null | head -1)
      [ -n "$url" ] || { echo "MIGRATE_DATABASE_URL is not set in backend/.env.migrate (see .env.example)." >&2; exit 1; }
      MIGRATE_DATABASE_URL="$url" uv run alembic upgrade head

  db:create-app-role:
    dir: backend
    desc: Give the lineup_app role a generated password and point backend/.env DATABASE_URL at it (password never printed)
    silent: true
    cmd: uv run python -m lineup.db.app_role

  migrate-new:
    dir: backend
    desc: "Auto-generate a new migration. Usage: task migrate-new -- -m 'description'"
    cmd: uv run alembic revision --autogenerate {{.CLI_ARGS}}

  migrate-down:
    dir: backend
    desc: Rollback one migration step
    cmd: uv run alembic downgrade -1

  fe:install:
    dir: frontend
    desc: Install frontend dependencies (pnpm, exact versions from pnpm-lock.yaml)
    cmd: pnpm install --frozen-lockfile

  fe:dev:
    dir: frontend
    desc: Start the Vite dev server on :5173 (proxies /api to the container from task up)
    cmd: pnpm dev

  fe:lint:
    dir: frontend
    desc: ESLint and Prettier check for the frontend
    cmds:
      - pnpm lint
      - pnpm format:check

  fe:format:
    dir: frontend
    desc: Format the frontend with Prettier
    cmd: pnpm format

  fe:typecheck:
    dir: frontend
    desc: TypeScript type check
    cmd: pnpm typecheck

  fe:test:
    dir: frontend
    desc: Run the frontend unit tests (Vitest)
    cmd: pnpm test

  fe:build:
    dir: frontend
    desc: Type-check and build the production bundle into frontend/dist
    cmd: pnpm build

  fe:check:
    desc: Everything the frontend CI job runs (lint, typecheck, test, build, API client freshness)
    cmds:
      - task: fe:lint
      - task: fe:test
      - task: fe:build
      - task: fe:api:check

  fe:api:
    desc: Regenerate the typed API client (frontend/src/api) from the backend's OpenAPI spec
    cmds:
      - cd backend && uv run python ../scripts/dump_openapi.py > ../frontend/src/api/openapi.json
      - cd frontend && pnpm run api:types

  fe:api:check:
    desc: Fail if the committed API client no longer matches the backend's OpenAPI spec (run by CI)
    silent: true
    cmd: |
      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT
      (cd backend && uv run python ../scripts/dump_openapi.py) > "$tmp/openapi.json"
      (cd frontend && pnpm exec openapi-typescript "$tmp/openapi.json" -o "$tmp/schema.d.ts" > /dev/null)
      if cmp -s "$tmp/openapi.json" frontend/src/api/openapi.json && cmp -s "$tmp/schema.d.ts" frontend/src/api/schema.d.ts; then
        echo "API client is up to date."
      else
        echo "frontend/src/api is stale: the backend's API changed. Run 'task fe:api' and commit the result." >&2
        exit 1
      fi

  docs:references:
    desc: Regenerate the dependency block in documentation/References.md
    cmd: python3 scripts/docs_references.py --write

  docs:check:
    desc: Fail if documentation/References.md is stale (run by CI)
    cmd: python3 scripts/docs_references.py --check
