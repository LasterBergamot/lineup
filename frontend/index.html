<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#02677f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- "Add to home screen": the app opens full-screen. No service worker on purpose: nothing, and
         certainly no personal data, is cached for offline use. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Lineup</title>
    <!-- Sets the saved theme before first paint so dark mode doesn't flash white. A separate
         same-origin file (not inline) keeps a strict Content-Security-Policy possible. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
